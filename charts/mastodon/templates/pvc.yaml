{{- if and (not .Values.s3.enabled) (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mastodon.fullname" . }}-uploads
  labels:
    {{- include "mastodon.labels" . | nindent 4 }}
  annotations:
    # Media survives helm uninstall; delete the claim by hand.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
