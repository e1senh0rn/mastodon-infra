# Update pins, build and smoke-test both architectures, publish a multi-arch
# image to ghcr.io, commit the pins back. See README.md ("CI").
name: build

on:
  # Disabled for now.
  # schedule:
  #   - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      update_mastodon:
        description: "Update Mastodon to the latest patch release of the pinned major.minor (or to mastodon_version)"
        type: boolean
        default: true
      mastodon_version:
        description: "Specific Mastodon tag instead of the latest release, e.g. v4.7.2 (needs update_mastodon)"
        required: false
        default: ""
      update_base:
        description: "Update nixpkgs, i.e. the base components"
        type: boolean
        default: true
      publish:
        description: "Publish the images to ghcr.io (default branch only)"
        type: boolean
        default: true
      commit:
        description: "Commit and push updated pins"
        type: boolean
        default: true
      force:
        description: "Build and publish even if identical to the published :latest"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: &build-paths
      - flake.nix
      - flake.lock
      - mastodon/**
      - nix/**
      - patches/**
      - scripts/smoke-test.sh
      - .github/workflows/build.yml
      - .github/workflows/actions.lock
  pull_request:
    paths: *build-paths

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mastodon
  # Index annotations: hash of the image store paths :latest was built from,
  # and its immutable tag (what the chart pins).
  FINGERPRINT_KEY: io.github.nix.image-fingerprint
  TAG_KEY: io.github.nix.image-tag

jobs:
  prepare:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      fingerprint: ${{ steps.meta.outputs.fingerprint }}
      nixpkgs_rev: ${{ steps.meta.outputs.nixpkgs_rev }}
      build: ${{ steps.meta.outputs.build }}
      publish: ${{ steps.opts.outputs.publish }}
      commit: ${{ steps.opts.outputs.commit }}
      pins_changed: ${{ steps.pins.outputs.changed }}
      commit_message: ${{ steps.pins.outputs.message }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.5

      - name: Resolve options
        id: opts
        env:
          EVENT: ${{ github.event_name }}
          IN_UPDATE_MASTODON: ${{ inputs.update_mastodon }}
          IN_UPDATE_BASE: ${{ inputs.update_base }}
          IN_PUBLISH: ${{ inputs.publish }}
          IN_COMMIT: ${{ inputs.commit }}
          IN_FORCE: ${{ inputs.force }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$EVENT" in
            workflow_dispatch)
              update_mastodon=$IN_UPDATE_MASTODON update_base=$IN_UPDATE_BASE
              publish=$IN_PUBLISH commit=$IN_COMMIT force=$IN_FORCE
              # Schedule and push only run on the default branch anyway.
              if [[ "$publish" == true && "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
                echo "::warning::Not publishing from $GITHUB_REF; only $DEFAULT_BRANCH publishes."
                publish=false
              fi ;;
            schedule)
              update_mastodon=true update_base=true publish=true commit=true force=false ;;
            push)
              update_mastodon=false update_base=false publish=true commit=false force=false ;;
            *)
              update_mastodon=false update_base=false publish=false commit=false force=false ;;
          esac
          {
            echo "update_mastodon=$update_mastodon"
            echo "update_base=$update_base"
            echo "publish=$publish"
            echo "commit=$commit"
            echo "force=$force"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Update Mastodon
        if: steps.opts.outputs.update_mastodon == 'true'
        env:
          MASTODON_VERSION: ${{ inputs.mastodon_version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: nix run .#update-mastodon -- ${MASTODON_VERSION:+"$MASTODON_VERSION"}

      - name: Update nixpkgs
        if: steps.opts.outputs.update_base == 'true'
        run: nix run .#update-base

      - name: Describe pin changes
        id: pins
        run: |
          changes=()
          if ! git diff --quiet -- flake.lock; then
            old=$(git show HEAD:flake.lock | jq -r '.nodes.nixpkgs.locked.rev[0:12]')
            new=$(jq -r '.nodes.nixpkgs.locked.rev[0:12]' flake.lock)
            changes+=("nixpkgs $old -> $new")
          fi
          if [[ -n "$(git status --porcelain -- mastodon/)" ]]; then
            ver() { sed -n 's/^  version = "\(.*\)";$/\1/p'; }
            old=$(git show HEAD:mastodon/source.nix 2>/dev/null | ver)
            new=$(ver <mastodon/source.nix)
            changes+=("Mastodon ${old:-none} -> $new")
          fi
          if [[ ${#changes[@]} -eq 0 ]]; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            echo "Pins unchanged."
          else
            joined=$(IFS=,; echo "${changes[*]}")
            message="Update ${joined//,/, }"
            echo "changed=true" >>"$GITHUB_OUTPUT"
            echo "message=$message" >>"$GITHUB_OUTPUT"
            echo "$message"
            echo "### $message" >>"$GITHUB_STEP_SUMMARY"
          fi

      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute tags and fingerprint
        id: meta
        env:
          PUBLISH: ${{ steps.opts.outputs.publish }}
          FORCE: ${{ steps.opts.outputs.force }}
        run: |
          version=$(nix eval --raw .#packages.x86_64-linux.mastodon.version)
          tag="v${version}-$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          nixpkgs_rev=$(jq -r .nodes.nixpkgs.locked.rev flake.lock)
          # Evaluation only, nothing is built.
          fingerprint=$(
            { nix eval --raw .#packages.x86_64-linux.image.outPath; echo
              nix eval --raw .#packages.aarch64-linux.image.outPath; echo; } | sha256sum | cut -d' ' -f1
          )

          # Without publishing, the build itself is the point.
          build=true
          if [[ "$PUBLISH" == true && "$FORCE" != true ]]; then
            published=$(docker buildx imagetools inspect --raw "$IMAGE:latest" 2>/dev/null |
              jq -r --arg k "$FINGERPRINT_KEY" '.annotations[$k] // empty' || true)
            if [[ "$fingerprint" == "$published" ]]; then
              build=false
              echo "::notice::Image identical to the published :latest ($fingerprint) - skipping build and publish."
            fi
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "fingerprint=$fingerprint"
            echo "nixpkgs_rev=$nixpkgs_rev"
            echo "build=$build"
          } | tee -a "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: pins
          path: |
            flake.lock
            mastodon/
          if-no-files-found: error

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            arch: amd64
            runner: ubuntu-26.04
          - system: aarch64-linux
            arch: arm64
            # Free for public repos only; override for a private one.
            runner: ${{ vars.ARM64_RUNNER || 'ubuntu-26.04-arm' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: pins
      - uses: cachix/install-nix-action@v31.11.5
      # Optional cache for the Mastodon-specific builds.
      - uses: cachix/cachix-action@v17
        if: vars.CACHIX_NAME != ''
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Checks
        run: nix build -L --no-link .#checks.${{ matrix.system }}.patched-syntax .#checks.${{ matrix.system }}.toolchain

      - name: Build image
        run: nix build -L --no-link .#packages.${{ matrix.system }}.image

      - name: Smoke test
        run: |
          nix run .#load-${{ matrix.arch }} -- mastodon:ci
          scripts/smoke-test.sh mastodon:ci

      - name: Push ${{ matrix.arch }}
        if: needs.prepare.outputs.publish == 'true'
        env:
          REF: ${{ env.IMAGE }}:${{ needs.prepare.outputs.tag }}-${{ matrix.arch }}
          CREDS: ${{ github.actor }}:${{ github.token }}
        run: nix run .#push-${{ matrix.arch }} -- "$REF" --dest-creds "$CREDS"

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-26.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create multi-arch tags
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          FINGERPRINT: ${{ needs.prepare.outputs.fingerprint }}
          NIXPKGS_REV: ${{ needs.prepare.outputs.nixpkgs_rev }}
        run: |
          # Provenance goes here, not in the image config (see nix/image.nix).
          docker buildx imagetools create \
            --annotation "index:$FINGERPRINT_KEY=$FINGERPRINT" \
            --annotation "index:$TAG_KEY=$TAG" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "index:org.nixos.nixpkgs.revision=$NIXPKGS_REV" \
            -t "$IMAGE:$TAG" \
            -t "$IMAGE:v$VERSION" \
            -t "$IMAGE:latest" \
            "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"

          digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r .digest)
          {
            echo "### Published"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Immutable tag | \`$IMAGE:$TAG\` |"
            echo "| Digest | \`$IMAGE@$digest\` |"
            echo "| Also tagged | \`v$VERSION\`, \`latest\` |"
          } >>"$GITHUB_STEP_SUMMARY"

  commit:
    needs: [prepare, build, publish]
    # Only commit proven pins: built, tested and (if requested) published,
    # or identical to the published image. Whenever publishing is on, the
    # chart is also pinned to the published :latest.
    if: >-
      always()
      && needs.prepare.result == 'success'
      && (needs.prepare.outputs.build != 'true' || needs.build.result == 'success')
      && (needs.prepare.outputs.build != 'true' || needs.prepare.outputs.publish != 'true' || needs.publish.result == 'success')
      && ((needs.prepare.outputs.commit == 'true' && needs.prepare.outputs.pins_changed == 'true') || needs.prepare.outputs.publish == 'true')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: read
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        if: needs.prepare.outputs.commit == 'true' && needs.prepare.outputs.pins_changed == 'true'
        with:
          name: pins

      - uses: docker/login-action@v4.8.0
        if: needs.prepare.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # From :latest rather than this run's outputs, so the chart also catches
      # up after a run that published but failed to commit.
      - name: Pin the chart to :latest
        id: chart
        if: needs.prepare.outputs.publish == 'true'
        run: |
          tag=$(docker buildx imagetools inspect --raw "$IMAGE:latest" | jq -r --arg k "$TAG_KEY" '.annotations[$k] // empty')
          digest=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest}}' | jq -r .digest)
          if [[ -z "$tag" ]]; then
            echo "::warning::$IMAGE:latest has no $TAG_KEY annotation (published before it existed); chart left as is."
            exit 0
          fi
          scripts/update-chart.sh "$tag" "$digest" 2>&1 | tee "$RUNNER_TEMP/chart.log"
          echo "change=$(grep '^Chart .* -> ' "$RUNNER_TEMP/chart.log" || true)" >>"$GITHUB_OUTPUT"

      - name: Commit and push
        id: push
        env:
          MESSAGE: ${{ needs.prepare.outputs.commit_message }}
          CHART: ${{ steps.chart.outputs.change }}
          TAG: ${{ needs.prepare.outputs.tag }}
          BUILT: ${{ needs.build.result == 'success' }}
          PUBLISHED: ${{ needs.publish.result == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock mastodon/ charts/mastodon/
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [[ "$BUILT" == true ]]; then
            body="Built and smoke-tested in $run_url"
          else
            body="Image identical to the published :latest, so not rebuilt ($run_url)"
          fi
          if [[ "$PUBLISHED" == true ]]; then
            body+=$'\n'"Published as $IMAGE:$TAG"
          fi
          if [[ -n "$CHART" ]]; then
            body+=$'\n'"$CHART"
          fi
          git commit -m "${MESSAGE:-${CHART:-Update chart}}" -m "$body"
          # GITHUB_TOKEN pushes don't trigger another run.
          git pull --rebase
          git push
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

  # Releases the chart if its version isn't published yet (a no-op otherwise).
  chart:
    needs: [prepare, commit]
    if: always() && needs.commit.result == 'success' && needs.prepare.outputs.publish == 'true'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/chart.yml
    with:
      ref: ${{ needs.commit.outputs.sha }}
